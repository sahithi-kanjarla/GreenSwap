[project]
name = "backend"
version = "0.1.0"
description = "GreenSwap agent backend: environmentally preferable product alternatives via SerpApi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.28.0",
    "google-search-results>=2.4.2",
    "groq>=1.7.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
